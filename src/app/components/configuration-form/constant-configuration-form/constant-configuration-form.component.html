<div class="constant-configuration-form__wrapper">
    <div class="form__inputs-group flex">
        <div class="input-w-label flex">
            <div class="input-label" *ngIf="first">
                Nom de la constante
            </div>
            <input [(ngModel)]="constant.key" pInputText type="text" pSize="small" placeholder="Nom de la constante"
                fluid (onChange)="keyChange()" />
        </div>
        <div class="input-w-label width-128">
            <div class="input-label" *ngIf="first">Type</div>
            <p-select [options]="types" [(ngModel)]="constant.type" size="small" placeholder="Selectionner un type"
                fluid optionValue="value" optionLabel="label" appendTo="body" />
        </div>
    </div>
    <div class="form__inputs-group flex constant-rule__wrapper gap-s">
        <div class="input-w-label width-128">
            <div class="input-label" *ngIf="first">Règle</div>
            <p-select [options]="rules" [(ngModel)]="constant.value.rule" size="small"
                placeholder="Selectionner une règle" optionValue="value" optionLabel="label" appendTo="body"
                (onChange)="ruleChange()" />
        </div>
        <div class="input-w-label flex">
            <div class="input-label" *ngIf="first">Paramètres</div>
            @switch (constant.value.rule) {
            @case ('calculation') {
            <input pInputText [(ngModel)]="constant.value.parameters.formula" type="text" pSize="small" fluid
                placeholder="Ex: PRIX * 1.20 ou 'FR' + SIRET"
                pTooltip="Utilisez les noms des autres constantes/attributs" tooltipPosition="top" />
            }
            @case ('configuration') {
            <div class="flex align-center gap-s">
                <p-select [options]="modelConfigurationService.configurations"
                    [(ngModel)]="constant.value.parameters.object_id" size="small"
                    placeholder="Selectionner une configuration" fluid appendTo="body">
                    <ng-template let-option pTemplate="item">
                        <div class="flex align-center gap-s space-between w-100">
                            <span class="item-label">{{ option.label }}</span>
                            <p-button icon="pi pi-minus" text severity="danger" size="small"
                                [style]="{ 'padding': '0' }"
                                (click)="modelConfigurationService.deleteConfiguration(option.value); $event.stopPropagation();"
                                (mousedown)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()"
                                (keydown.space)="$event.stopPropagation()" />
                        </div>
                    </ng-template>
                    <ng-template pTemplate="footer">
                        <p-button class="flex justify-center w-100" label="Nouveau" severity="secondary" text
                            size="small" icon="pi pi-plus" flex (click)="createConfiguration()" />
                    </ng-template>
                </p-select>
                <p-button icon="pi pi-eye" severity="secondary" text size="small" pTooltip="Ouvrir la configuration"
                    tooltipPosition="left" appendTo="body" (click)="openConfiguration()" />
            </div>
            }
            @case ('data') {
            <div class="flex align-center gap-s">
                <p-select [options]="modelDataService.datas" [(ngModel)]="constant.value.parameters.object_id"
                    size="small" placeholder="Selectionner une liste de données" fluid appendTo="body">
                    <ng-template let-option pTemplate="item">
                        <div class="flex align-center gap-s space-between w-100">
                            <span class="item-label">{{ option.label }}</span>
                            <p-button icon="pi pi-minus" text severity="danger" size="small"
                                [style]="{ 'padding': '0' }"
                                (click)="modelDataService.deleteData(option.value); $event.stopPropagation();"
                                (mousedown)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()"
                                (keydown.space)="$event.stopPropagation()" />
                        </div>
                    </ng-template>
                    <ng-template pTemplate="footer">
                        <p-button class="flex justify-center w-100" label="Nouveau" severity="secondary" text
                            size="small" icon="pi pi-plus" flex (click)="createData()" />
                    </ng-template>
                </p-select>
                <p-button icon="pi pi-eye" severity="secondary" text size="small" pTooltip="Ouvrir la liste de données"
                    tooltipPosition="left" appendTo="body" (click)="openData()" />
            </div>
            }
            @case ('randint') {
            <div class="flex gap-s">
                <input pInputText [(ngModel)]="constant.value.parameters.min" type="text" pSize="small" fluid
                    placeholder="Min" [pKeyFilter]="'int'" />
                <input pInputText [(ngModel)]="constant.value.parameters.max" type="text" pSize="small" fluid
                    placeholder="Max" [pKeyFilter]="'int'" />
            </div>
            }
            @case ('alphanumeric') {
            <input pInputText [(ngModel)]="constant.value.parameters.constraint" type="text" pSize="small" fluid
                placeholder="Expression régulière" />
            }
            }
        </div>

    </div>
    <p-button icon="pi pi-minus" severity="danger" size="small" pTooltip="Supprimer la constante" tooltipPosition="left"
        text (click)="remove.emit()"></p-button>
</div>
